<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome · Family Status</title>
    <style>
        /* side by side on wide screens; wraps to top/bottom on phones */
        .choices { display: flex; flex-wrap: wrap; gap: 16px; }
        .choice  { flex: 1 1 280px; border: 2px solid #ccc; border-radius: 12px; padding: 24px; }
    </style>
</head>
<body>
    <h1>Welcome!</h1>
    <p>Logged in as {{ email }}. You're not in a family yet.</p>

    <div class="choices">
        <section class="choice">
            <h2>Create a family</h2>
            <form method="post" action="/families">
                <p><input name="family_name" maxlength="40" placeholder="Family name" required></p>
                <p><input name="your_name" maxlength="40" placeholder="Your name in this family" required></p>
                <button type="submit">Create</button>
            </form>
        </section>

        <section class="choice">
            <h2>Join a family</h2>
            <form method="post" action="/families/join">
                <p><input name="code" maxlength="64" placeholder="Invite code" required></p>
                <button type="submit" disabled>Join (coming soon)</button>
            </form>
        </section>
    </div>

    <form method="post" action="/logout"><button type="submit">Log out</button></form>
</body>
</html>
